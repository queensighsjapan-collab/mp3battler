<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOOLS — Yu_My_Love Tool Box</title>
<style>
  :root{
    --bg: #05070d;
    --ink: #eef1f8;
    --ink-dim: #6f7a90;
    --line: #202839;
    --c1: #ff2ea6; /* magenta - tools theme */
    --c2: #2ee6ff; /* cyan */
    --c3: #b26bff; /* purple */
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px) 0 0 / 100% 42px,
      radial-gradient(1200px 700px at 50% -10%, #131a2b 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: 'Courier New', Consolas, monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 40px 20px 40px;
    overflow-x:hidden;
  }

  .glow-line{
    position:fixed;
    top:0; left:0; right:0;
    height:2px;
    background: linear-gradient(90deg, transparent, var(--c2), var(--c1), transparent);
    opacity:0.6;
    animation: sweep 6s linear infinite;
  }
  @keyframes sweep{
    0%{ transform: translateX(-30%); }
    100%{ transform: translateX(30%); }
  }

  .back{
    align-self:flex-start;
    max-width:980px;
    width:100%;
    margin: 0 auto 28px;
  }
  .back a{
    color: var(--ink-dim);
    text-decoration:none;
    font-size: 11px;
    letter-spacing: 2px;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 14px;
    transition: color .2s ease, border-color .2s ease;
  }
  .back a:hover{ color: var(--c2); border-color: var(--c2); }

  h1{
    font-size: clamp(24px, 5.5vw, 42px);
    letter-spacing: 3px;
    margin: 0 0 6px;
    text-align:center;
    background: linear-gradient(90deg, var(--c1), var(--c2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 50px rgba(255,255,255,0.06);
  }
  .subtitle{
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 56px;
    text-align:center;
  }

  .nav-grid{
    width: 100%;
    max-width: 980px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 760px){
    .nav-grid{ grid-template-columns: 1fr; max-width: 420px; }
  }

  .card{
    position: relative;
    display:block;
    text-decoration:none;
    color: inherit;
    background: linear-gradient(180deg, #10141f, #0a0d16);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 34px 22px 28px;
    text-align:center;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card:hover{
    transform: translateY(-4px);
    border-color: var(--card-color);
    box-shadow: 0 10px 40px -10px var(--card-glow), inset 0 0 0 1px var(--card-color);
  }
  .card .icon{
    width: 56px; height:56px;
    margin: 0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    color: var(--card-color);
    filter: drop-shadow(0 0 10px var(--card-glow));
  }
  .card .icon svg{ width:100%; height:100%; }
  .card .label{
    font-size: 16px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    color: var(--ink);
  }
  .card .desc{
    font-size: 11px;
    line-height: 1.7;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }
  .card .tag{
    display:inline-block;
    margin-top: 14px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--card-color);
    border: 1px solid var(--card-color);
    border-radius: 20px;
    padding: 3px 12px;
    opacity: 0.85;
  }

  .card.soon{
    opacity: 0.4;
    cursor:default;
    pointer-events:none;
  }

  #card-suno{ --card-color: var(--c1); --card-glow: rgba(255,46,166,0.35); }
  .card.soon{ --card-color: var(--ink-dim); --card-glow: rgba(111,122,144,0.2); }

  footer{
    margin-top: 60px;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 2px;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="glow-line"></div>

  <div class="back"><a href="../index.html">&larr; BACK TO ROOT</a></div>

  <h1>TOOLS</h1>
  <div class="subtitle">Prompt Assist Modules</div>

  <div class="nav-grid">
    <a class="card" id="card-suno" href="./suno-prompt-translator.html">
      <div class="icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 30 V22 C8 14 14 8 24 8 C34 8 40 14 40 22 V30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="4" y="28" width="8" height="12" rx="3" fill="currentColor"/>
          <rect x="36" y="28" width="8" height="12" rx="3" fill="currentColor"/>
        </svg>
      </div>
      <div class="label">SUNO TRANSLATOR</div>
      <div class="desc">歌詞の [ ] タグだけをSuno向け英語に変換<br>アーティスト名は雰囲気タグへ自動置換</div>
      <span class="tag">MUSIC</span>
    </a>

    <div class="card soon">
      <div class="icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="16" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 5"/>
        </svg>
      </div>
      <div class="label">COMING SOON</div>
      <div class="desc">画像・動画生成プロンプト翻訳機<br>準備中</div>
      <span class="tag">SOON</span>
    </div>
  </div>

  <footer>YU_MY_LOVE TOOL BOX &mdash; TOOLS MODULE</footer>
</body>
</html>
